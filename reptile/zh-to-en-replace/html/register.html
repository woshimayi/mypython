<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>中国移动</title>
	<link rel="stylesheet" href="css/bootstrap-4.3.1.min.css">
	<link rel="stylesheet" href="css/bootstrap-hg.css">
	<link rel="stylesheet" href="css/register.css">
	<script src="js/jquery-3.6.0.min.js"></script>
	<script src="js/hgs_public_def.js"></script>
	<script src="js/hgs_validator.js"></script>
	<script src="js/customer.js"></script>
	<script src="js/hgs_update_data.js"></script>
	<script src="js/state-machine.min.js"></script>
	<script src="js/register.js"></script>
</head>
<body>
	<nav class="navbar">
		<a class="navbar-brand logo" href="#" id="logo" hgs_static_key="CustomerChineseName" >中国移动</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			<span class="navbar-toggler-icon"></span>
		</button>

		<ul class="nav justify-content-end">
			<!--需使用<a></a>，否则无法保持文字水平居中，会略为偏上-->
			<li class="nav-item">
				<a class="nav-link">网关名称:<span hgs_static_key="ProductType">全光组网终端</span></a>
			</li>
			<li class="nav-item">
				<a class="nav-link">网关型号:<span hgs_static_key="ModelName">TEWA-700G</span></a>
			</li>
			<li class="nav-item"><a class="nav-link">欢迎您！</a>
			</li>
		</ul>
	</nav>

	<div class="container" id="context">
		<div id="backToLogin">
			<button class="button">返回登录页面</button>
		</div>
		<div class="register_box">
			<br><br>
			<h6>终端注册</h6>
			<hr>
			<form class="form_box">
				<p>请插紧光纤并确认光信号灯已处于熄灭状态。</p>
				<p>准确输入“<span id="authTypeHint">Password</span>”，点击“确定”进行注册。</p>
				<p>在注册及业务下发过程中（10 分钟内）不要断电、不要拔光纤。</p>
				<p>本注册功能仅用于新设备的认证及业务下发，已正常在用设备请勿重新注册。</p>
				<br>
				<div class="input-group mb-3 pwdDiv">
					<div class="input-group-prepend">
						<span class="input-group-text" id="passwordTitle">密码</span>
					</div>
					<input type="text" class="form-control" id="Password" placeholder="请输入密码">
					<!-- <img src="img/eye.png" id="eye_password"> -->
				</div>
				<div class="mb-3">
					<span class="pwdLengthInfo">当前输入了</span>
					<span id="pwdLength">0</span>
					<span class="pwdLengthInfo" id="pwdtext">位password</span>
					<span class="pwdLengthInfo" id="pwdLengthInfo"></span>
				</div>
				<div class="divCenter">
					<button type="button" class="button" id="save">确定</button>
					<button type="button" class="button" id="reset">重置</button>
				</div>
			</form>
			<div class="hideElm" id="progress_info">
				<div id="oltInfo">正在注册OLT</div>
				<div class="progress">
					<div id="probar" class="progress-bar progress-bar-striped progress-bar-animated"></div>
				</div>
			</div>

			<div class="hideElm" id="err">
				<h6 class="errInfo">出错！</h6>
				<div id="errInfo"></div>
				<div id="errReason"></div>
			</div>
			<br><br><br><br>
			<div class="hideElm" id="backToReg">
				<button class="button" id="backToRegBtn">返回</button>
			</div>
			<div class="hideElm" id="back">
				<button class="button" id="backBtn">返回</button>
			</div>
		</div>
	</div>

	<div>&nbsp;</div>
	<div class="row foot_note">
		<div class="col-12">
			<div class="divCenter" ><span id="hgs_copyright">Copyright &copy;</span><span hgs_static_key="ShowCopyright">2001-2021 HGS. All rights reserved.</span></div>
		</div>
	</div>
</body>
</html>
